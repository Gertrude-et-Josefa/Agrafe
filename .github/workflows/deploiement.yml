# Publication automatique chez o2switch
#  - branche test -> sous-domaine de test
#  - branche main -> agrafe.gertrudeetjosefa.fr (production)
# Les identifiants FTP sont des « secrets » GitHub : ils ne figurent jamais dans le code.
name: Publication

on:
  push:
    branches: [test, main]

jobs:
  publier:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'test' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation
        run: npm ci

      - name: Construction
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Envoi chez o2switch
        # lftp en FTPS (chiffré), qui gère la reprise de session TLS exigée par le serveur.
        # Les dossiers techniques de l'hébergeur (.well-known pour le SSL, cgi-bin) ne sont jamais touchés.
        env:
          FTP_SERVEUR: ${{ secrets.FTP_SERVEUR }}
          FTP_UTILISATEUR: ${{ secrets.FTP_UTILISATEUR }}
          FTP_MOT_DE_PASSE: ${{ secrets.FTP_MOT_DE_PASSE }}
          FTP_DOSSIER: ${{ vars.FTP_DOSSIER }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 2;
            set net:timeout 30;
            open -u \"$FTP_UTILISATEUR\",\"$FTP_MOT_DE_PASSE\" \"$FTP_SERVEUR\";
            mirror --reverse --delete --verbose=1 --exclude-glob .well-known/ --exclude-glob cgi-bin/ --exclude-glob .ftpquota ./build/ \"$FTP_DOSSIER\"
          "
